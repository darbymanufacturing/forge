name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Use a dummy URL for codegen — no real DB needed
          DATABASE_URL: "postgresql://user:pass@localhost:5432/forge"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/forge"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build admin app
        run: npm run build
        env:
          SHOPIFY_API_KEY: "ci_placeholder"
          SHOPIFY_API_SECRET: "ci_placeholder"
          SHOPIFY_APP_URL: "https://forge.example.com"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/forge"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/forge"
          SCOPES: "read_products,write_products,read_orders,write_orders"

      - name: Build customizer extension
        run: npm run build:customizer

      - name: "⛔ Bundle size gate — customizer must be < 150 KB gzipped"
        run: |
          BUNDLE="extensions/customizer/assets/forge-customizer.js"
          if [ ! -f "$BUNDLE" ]; then
            echo "❌  Bundle not found: $BUNDLE"
            exit 1
          fi
          # The build script already checks and exits non-zero if over budget.
          # This step just surfaces the result as a named CI step.
          echo "✅  Bundle size gate passed."
