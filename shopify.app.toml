# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "FORGE"
client_id = ""
handle = "forge-pod-customizer"
application_url = "https://PLACEHOLDER.vercel.app"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# https://shopify.dev/docs/api/usage/access-scopes
scopes = "read_products,write_products,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://PLACEHOLDER.vercel.app/auth/callback",
  "https://PLACEHOLDER.vercel.app/auth/shopify/callback",
  "https://PLACEHOLDER.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # App lifecycle
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # GDPR webhooks — required for public apps
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[pos]
embedded = false
